<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>CronOVO</title>
</head>
<body>
    <main class="container">
        <h2>CronOvo</h2>
        <img src="IMGS/LOGO.PNG" alt="">

        <section id="conteudo">

           <div>
            <button class="botoes"  type="button"><img src="IMGS/GEMAMOLE.PNG" onclick="mole()" alt="Imagem não carregada"></button>
            <h2>Gema Mole</h2>
           </div> 
           <div>
            <button class="botoes" type="button"><img src="IMGS/GEMAMEDIA.png" height="" onclick="medio()" alt="Imagem não carregada"></button>
            <h2>Gema Meio Termo</h2>
           </div> 
           <div>
            <button class="botoes" type="button"><img src="IMGS/GEMADURA.png" onclick="duro()"  alt="Imagem não carregada"></button>
            <h2>Gema Dura</h2>
           </div> 

        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
